# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Run Gradle in parallel mode (safe for Expo / RN projects)
org.gradle.parallel=true

# ? AndroidX and Jetifier (required by RN)
android.useAndroidX=true
android.enableJetifier=true

# ? AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# ? Architectures to build (keep default)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# ? Enable new React Native architecture (Fabric / TurboModules)
newArchEnabled=true

# ? Enable Hermes JS engine (default for RN 0.81+)
hermesEnabled=true

# ? Enable edge-to-edge display support
edgeToEdgeEnabled=true

# ? Expo-specific image formats and optimizations
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# ? Enable network inspector for development client
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# ? Use legacy packaging off (default for modern Android)
expo.useLegacyPackaging=false

# ? Maintain backward compatibility with edge-to-edge
expo.edgeToEdgeEnabled=true

# ? Forza Gradle a usare OpenJDK 17 (indipendentemente da quello di sistema)
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# ? Disattiva la trasformazione JDK image (bug Reanimated + AGP 8.x)
android.experimental.disableJdkImageTransform=true
