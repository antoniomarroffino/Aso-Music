# =======================================================
# HTTP SERVER CONFIG
# =======================================================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Abilita compressione (riduce egress network)
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/plain

# =======================================================
# CORS CONFIG
# =======================================================
# Per sviluppo locale e app mobile Expo
# (in futuro potrai restringere gli origin a quello definitivo)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8081,http://localhost:3000,http://localhost:19006,*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# =======================================================
# API BASE PATH
# =======================================================
quarkus.rest.path=/api

# =======================================================
# FIREBASE STORAGE
# =======================================================
firebase.storage.bucket=asomusic-d39c4.appspot.com
firebase.storage.url-expiration-hours=24
